# AGOS — Docker Compose (Full Development Stack)
# Run: docker compose up -d

services:

  # ─── PostgreSQL ────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: agos-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: agos_db
      POSTGRES_USER: agos
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-agos_dev_2026}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agos"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ─── Redis ─────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: agos-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-agos_redis_2026}
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-agos_redis_2026}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ─── NATS Server ───────────────────────────────────────────
  nats:
    image: nats:2-alpine
    container_name: agos-nats
    restart: unless-stopped
    ports:
      - "4222:4222"   # Client
      - "8222:8222"   # Monitoring
    command: --jetstream --store_dir /data/jetstream
    volumes:
      - natsdata:/data

  # ─── Go Orchestrator Daemon ────────────────────────────────
  orchestrator:
    build:
      context: .
      dockerfile: docker/Dockerfile.orchestrator
    container_name: agos-orchestrator
    restart: unless-stopped
    ports:
      - "50051:50051"   # gRPC
      - "8765:8765"     # HTTP/Telemetry
    environment:
      POSTGRES_URL: postgres://agos:${POSTGRES_PASSWORD:-agos_dev_2026}@postgres:5432/agos_db?sslmode=disable
      REDIS_URL: redis://:${REDIS_PASSWORD:-agos_redis_2026}@redis:6379/0
      NATS_URL: nats://nats:4222
      JWT_SECRET: ${JWT_SECRET:-agos_jwt_secret_2026}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      nats:
        condition: service_started

  # ─── Python Agent Runtime ──────────────────────────────────
  agents:
    build:
      context: .
      dockerfile: docker/Dockerfile.agents
    container_name: agos-agents
    restart: unless-stopped
    environment:
      POSTGRES_URL: postgres://agos:${POSTGRES_PASSWORD:-agos_dev_2026}@postgres:5432/agos_db?sslmode=disable
      REDIS_URL: redis://:${REDIS_PASSWORD:-agos_redis_2026}@redis:6379/0
      NATS_URL: nats://nats:4222
      OLLAMA_URL: http://host.docker.internal:11434
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
    depends_on:
      - orchestrator
    volumes:
      - agentdata:/app/data

  # ─── Prometheus ────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: agos-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./docker/prometheus.yml:/etc/prometheus/prometheus.yml
      - promdata:/prometheus

  # ─── Grafana ───────────────────────────────────────────────
  grafana:
    image: grafana/grafana:11.0.0
    container_name: agos-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-agos_grafana_2026}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafanadata:/var/lib/grafana
    depends_on:
      - prometheus

volumes:
  pgdata:
  redisdata:
  natsdata:
  agentdata:
  promdata:
  grafanadata:
