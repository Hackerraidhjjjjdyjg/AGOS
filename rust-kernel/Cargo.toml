[package]
name = "agos-kernel"
version = "0.1.0"
edition = "2021"
description = "AGOS Kernel — Memory pager, IPC bus, constitutional firewall"
authors = ["Sehaj Vir Singh"]

[lib]
name = "agos_kernel"
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
env_logger = "0.11"
thiserror = "1"
parking_lot = "0.12"
ed25519-dalek = { version = "2", features = ["rand_core"] }
rand = "0.8"
sha2 = "0.10"
crossbeam-channel = "0.5"
chrono = { version = "0.4", features = ["serde"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
